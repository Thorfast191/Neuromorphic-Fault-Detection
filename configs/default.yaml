project:
  name: Neuromorphic Fault Detection

seed: 42

device: auto

dataset:
  name: CWRU

  root: data/raw/CWRU

  window_size: 2048

  overlap: 0.5

  normalize: true

training:
  epochs: 100

  batch_size: 64

  lr: 0.001

  optimizer: Adam

model:
  architecture: lif

encoding:
  type: rate

results:
  output_dir: results
